name: Scheduled MTPASA Monitoring

on:
  schedule:
    # Mon–Fri real-time push at 09:20, 12:20, 15:20
    - cron: '20 23,2,5 * * 0-4'  # AEST: 09:20, 12:20, 15:20
    # Tue–Fri 07:00 morning recap (Mon–Thu 21:00 UTC)
    - cron: '0 21 * * 1-4'
    # Sat 09:20, 12:20, 15:20, 18:20 store-only
    - cron: '20 23,2,5,8 * * 5'
    # Mon 07:00 full weekend recap (Sun 21:00 UTC)
    - cron: '0 21 * * 0'
  workflow_dispatch:

jobs:
  scheduled-pasa-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Run scheduled MTPASA logic
        run: python <your-script-name>.py
