name: Scheduled MTPASA Summary Test

on:
  workflow_dispatch:

jobs:
  run-mtpasa-scheduler-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Run scheduled script in TEST mode
        run: python mtpasa_summary_scheduler.py --test
