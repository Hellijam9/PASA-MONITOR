# .github/workflows/mtpasa_summary_scheduler.yml
name: MTPASA Summary Scheduler

on:
  schedule:
    # Mon–Fri: 09:20, 12:20, 15:20, 18:20 AEST (UTC = AEST - 10)
    - cron: "20 23 * * 0-4"  # 09:20 AEST Mon–Fri
    - cron: "20 2 * * 1-5"   # 12:20 AEST Tue–Sat
    - cron: "20 5 * * 1-5"   # 15:20 AEST Tue–Sat
    - cron: "20 8 * * 1-5"   # 18:20 AEST Tue–Sat
    # Morning recaps
    - cron: "0 21 * * 0"     # 07:00 AEST Monday (recap Fri 18:20 + Sat)
    - cron: "0 21 * * 1-4"   # 07:00 AEST Tue–Fri (recap prev 18:20)

  workflow_dispatch:

jobs:
  run-summary-scheduler:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Run summary script
        run: python mtpasa_summary_scheduler.py
