name: Get Latest Two MTPASA ZIP URLs

on:
  workflow_dispatch:

jobs:
  fetch-latest-urls:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run URL fetcher
        run: python get_latest_urls.py
