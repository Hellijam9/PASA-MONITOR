name: Scheduled MTPASA Monitor

on:
  schedule:
    # Monday: 07:00 for Friday 18:20 + all Saturday runs
    - cron: '0 21 * * 0'   # Sunday 21:00 UTC = Monday 07:00 AEST
    
    # Tuesday to Friday: 07:00 summary of previous day's 18:20 run
    - cron: '0 21 * * 1-4' # Mon-Thu 21:00 UTC = Tue-Fri 07:00 AEST

    # Monday to Friday real-time runs
    - cron: '20 23 * * 0-4' # 09:20 AEST
    - cron: '20 2  * * 1-5' # 12:20 AEST
    - cron: '20 5  * * 1-5' # 15:20 AEST

  workflow_dispatch:

jobs:
  monitor-mtpasa:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Run MTPASA analysis
        run: python get_csv_dynamic.py
