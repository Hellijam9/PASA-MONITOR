name: Triggered NOS Summary

on:
  workflow_dispatch:
  repository_dispatch:

jobs:
  run-nos-scheduler:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Run NOS script
        run: python monitor_nos.py --test
