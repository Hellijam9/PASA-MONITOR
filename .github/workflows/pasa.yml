name: MTPASA DUID Availability Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '20 23 * * 0'  # Monday 09:20 AEST (Sunday 23:20 UTC)
    - cron: '20 23 * * 1-6'  # Tue–Sat 09:20 AEST
    - cron: '20 2 * * 1-6'   # Tue–Sat 12:20 AEST
    - cron: '20 5 * * 1-6'   # Tue–Sat 15:20 AEST
    - cron: '20 8 * * 1-6'   # Tue–Sat 18:20 AEST

jobs:
  run-pasa-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests beautifulsoup4 lxml pytz

      - name: Run PASA monitor
        run: python Pasa.py
