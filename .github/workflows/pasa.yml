name: PASA Monitor

on:
  schedule:
    - cron: '0 20 * * 0'       # Monday 07:00 AEST (20:00 UTC Sunday)
    - cron: '20 23 * * 0-5'    # 09:20 AEST Mon–Sat (23:20 UTC)
    - cron: '20 2 * * 1-6'     # 12:20 AEST Mon–Sat (02:20 UTC)
    - cron: '20 5 * * 1-6'     # 15:20 AEST Mon–Sat (05:20 UTC)
    - cron: '20 8 * * 1-6'     # 18:20 AEST Mon–Sat (08:20 UTC)
  workflow_dispatch:

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Create data directory
        run: mkdir -p pasa_data

      - name: Download last 2 ZIPs from manifest.xml
        run: |
          curl -s https://nemweb.com.au/REPORTS/CURRENT/MTPASA_DUIDAvailability/manifest.xml | \
          grep -oE 'PUBLIC_MTPASADUIDAVAILABILITY_[^<]*?\.zip' | \
          sort | tail -n 2 | while read f; do
            echo "Downloading $f"
            wget -q "https://nemweb.com.au/REPORTS/CURRENT/MTPASA_DUIDAvailability/$f" -O "pasa_data/$f"
          done

      - name: List downloaded files
        run: ls -lh pasa_data

      - name: Run PASA monitor
        run: python monitor_pasa.py