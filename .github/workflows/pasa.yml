name: PASA Monitor

on:
  schedule:
    # 7:00 AEST Monday (20:00 UTC Sunday)
    - cron: '0 20 * * 0'
    # 9:20 AEST (23:20 UTC), Mon–Sat
    - cron: '20 23 * * 0-5'
    # 12:20 AEST (2:20 UTC), Mon–Sat
    - cron: '20 2 * * 1-6'
    # 15:20 AEST (5:20 UTC), Mon–Sat
    - cron: '20 5 * * 1-6'
    # 18:20 AEST (8:20 UTC), Mon–Sat
    - cron: '20 8 * * 1-6'
  workflow_dispatch:

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas beautifulsoup4 requests pytz

      - name: Run PASA monitor
        run: python monitor_pasa.py
