name: Run Dynamic MTPASA CSV Comparison

on:
  workflow_dispatch:

jobs:
  compare-latest-mtpasa:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Run dynamic comparison
        run: python get_csv_dynamic.py
